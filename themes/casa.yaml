Casa Carestiato:
  lovelace-background: 'linear-gradient(160deg, #05070a 0%, #0b0d10 45%, #0e1114 100%) fixed'
  primary-background-color: "#08090b"
  secondary-background-color: "#08090b"
  card-background-color: "rgba(255,255,255,0.045)"
  ha-card-background: "rgba(255,255,255,0.045)"
  app-header-background-color: "rgba(6,11,24,0.0)"
  primary-text-color: "#f3f2ef"
  text-primary-color: "#f3f2ef"
  secondary-text-color: "#9a9da3"
  disabled-text-color: "#5c5f64"
  divider-color: "rgba(255,255,255,0.08)"
  primary-color: "#c9a869"
  accent-color: "#c9a869"
  state-icon-color: "#8a8d93"
  state-active-color: "#c9a869"
  icon-color: "#e4e2dd"
  label-badge-background-color: "rgba(255,255,255,0.06)"
  ha-card-border-radius: "20px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "0 8px 28px rgba(0,0,0,0.5)"
  sidebar-background-color: "#08090b"
  sidebar-text-color: "#e4e2dd"
  sidebar-icon-color: "#8a8d93"
  sidebar-selected-background-color: "rgba(201,168,105,0.14)"
  sidebar-selected-icon-color: "#c9a869"
  sidebar-selected-text-color: "#c9a869"
  mdc-theme-primary: "#c9a869"
  table-row-background-color: "rgba(255,255,255,0.025)"
  table-row-alternative-background-color: "rgba(255,255,255,0.04)"
  switch-checked-color: "#c9a869"
  slider-color: "#c9a869"
  energy-grid-consumption-color: "#c9a869"
  app-header-text-color: "#f3f2ef"
  tile-color: "#c9a869"
  card-mod-theme: "Casa Carestiato"
  card-mod-root: |
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Outfit', sans-serif !important; }
  card-mod-card: |
    ha-card {
      font-family: 'Outfit', sans-serif;
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid rgba(255,255,255,0.07);
      border-top: 1px solid rgba(255,255,255,0.14);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    ha-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      border-color: rgba(201,168,105,0.4);
    }
  card-mod-view: |
    .title { font-family: 'Outfit', sans-serif !important; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px !important; font-weight: 600 !important; color: #8a8d93 !important; opacity: 1 !important; }
